<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"

>

<title>RiD Finity Dashboard</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at top right,
            #25304a 0%,
            #111827 35%,
            #080b12 100%
        );

    color: white;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width:
        min(
            1200px,
            94%
        );

    margin:
        auto;

    padding:
        25px 0 50px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        25px;

}


.title-area {

    display:
        flex;

    flex-direction:
        column;

    gap:
        4px;

}


.logo-title {

    font-size:
        26px;

    font-weight:
        800;

}


.update-time {

    font-size:
        13px;

    color:
        #9ca3af;

}


.settings-button {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        7px;

    min-height:
        44px;

    padding:
        0 17px;

    border:
        none;

    border-radius:
        11px;

    background:
        #374151;

    color:
        white;

    font-weight:
        800;

    cursor:
        pointer;

    text-decoration:
        none;

    transition:
        .2s;

}


.settings-button:hover {

    background:
        #4b5563;

    transform:
        translateY(-1px);

}


/* =====================================================
   CARD
===================================================== */

.card {

    background:
        rgba(
            17,
            24,
            39,
            .88
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    border-radius:
        20px;

    padding:
        22px;

    margin-bottom:
        20px;

    box-shadow:
        0 15px 40px
        rgba(
            0,
            0,
            0,
            .25
        );

    backdrop-filter:
        blur(15px);

}


.card-title {

    font-size:
        20px;

    font-weight:
        800;

    margin-bottom:
        18px;

}


/* =====================================================
   QUICK BUTTONS
   4 X 4
===================================================== */

.quick-buttons {

    display:
        grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:
        12px;

}


.quick-button {

    border:
        none;

    min-height:
        65px;

    border-radius:
        14px;

    background:

        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:
        white;

    font-size:
        15px;

    font-weight:
        800;

    cursor:
        pointer;

    transition:
        .2s;

    box-shadow:

        0 8px 20px
        rgba(
            37,
            99,
            235,
            .25
        );

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

}


.quick-button:hover {

    transform:
        translateY(-2px);

    filter:
        brightness(1.12);

}


.quick-button:active {

    transform:
        scale(.97);

}


/* =====================================================
   INPUT ROW
===================================================== */

.input-row {

    display:
        grid;

    grid-template-columns:
        170px
        1fr
        auto;

    gap:
        10px;

    align-items:
        center;

    margin-bottom:
        12px;

}


.input-label {

    font-weight:
        700;

    color:
        #e5e7eb;

}


.input-box {

    width:
        100%;

    min-height:
        48px;

    padding:
        10px 14px;

    border-radius:
        11px;

    border:
        1px solid
        #374151;

    background:
        #0b1120;

    color:
        white;

    outline:
        none;

    font-size:
        15px;

    font-family:
        inherit;

    resize:
        vertical;

}


.input-box:focus {

    border-color:
        #6366f1;

    box-shadow:

        0 0 0 3px
        rgba(
            99,
            102,
            241,
            .15
        );

}


/* =====================================================
   ACTIONS
===================================================== */

.actions {

    display:
        flex;

    gap:
        7px;

}


.btn {

    border:
        none;

    border-radius:
        10px;

    min-width:
        78px;

    min-height:
        43px;

    padding:
        0 13px;

    color:
        white;

    font-weight:
        800;

    cursor:
        pointer;

    transition:
        .2s;

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

}


.btn:hover {

    filter:
        brightness(1.15);

}


.btn-send {

    background:
        #16a34a;

}


.btn-copy {

    background:
        #2563eb;

}


.btn-download {

    background:
        #9333ea;

}


/* =====================================================
   BUTTON SPINNER (แบบหน้าโหลดข้อมูล)
===================================================== */

.btn-spinner {

    width:
        22px;

    height:
        22px;

    border-radius:
        50%;

    border:
        3px solid
        rgba(255, 255, 255, 0.3);

    border-top-color:
        #ffffff;

    animation:
        spin
        1s
        linear
        infinite;

}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        25px;

    transform:
        translate(
            -50%,
            120px
        );

    background:
        #111827;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    color:
        white;

    padding:
        13px 22px;

    border-radius:
        50px;

    font-weight:
        700;

    opacity:
        0;

    transition:
        .3s;

    z-index:
        9999;

}


.toast.show {

    opacity:
        1;

    transform:
        translate(
            -50%,
            0
        );

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    position:
        fixed;

    inset:
        0;

    background:
        #080b12;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    z-index:
        10000;

    transition:
        .3s;

}


.loading.hide {

    opacity:
        0;

    pointer-events:
        none;

}


.spinner {

    width:
        45px;

    height:
        45px;

    border-radius:
        50%;

    border:
        4px solid
        #374151;

    border-top-color:
        #6366f1;

    animation:
        spin
        1s
        linear
        infinite;

    margin-bottom:
        15px;

}


@keyframes spin {

    to {

        transform:
            rotate(
                360deg
            );

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 800px) {

    .container {

        width:
            94%;

        padding-top:
            15px;

    }


    .header {

        align-items:
            flex-start;

        flex-direction:
            row;

        gap:
            10px;

    }


    .logo-title {

        font-size:
            21px;

    }


    .update-time {

        font-size:
            12px;

    }


    .settings-button {

        min-width:
            45px;

        width:
            45px;

        padding:
            0;

        font-size:
            0;

    }


    .settings-button .gear {

        font-size:
            21px;

    }


    .quick-buttons {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }


    .input-row {

        grid-template-columns:
            1fr;

        gap:
            7px;

    }


    .actions {

        display:
            grid;

        grid-template-columns:
            repeat(
                3,
                1fr
            );

        width:
            100%;

    }


    .btn {

        width:
            100%;

    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width: 420px) {

    .card {

        padding:
            15px;

        border-radius:
            16px;

    }


    .quick-button {

        min-height:
            60px;

        font-size:
            13px;

    }


    .input-label {

        font-size:
            14px;

    }


    .btn {

        font-size:
            12px;

        min-width:
            0;

    }

}

</style>

<script>


/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbx-rKYscSSSPgw1dTlzf5BriEn9MPrQfFIEWDza6fYd2nxlPTnCsBT2sWNOLr6csF4k/exec";


/* =====================================================
   DATA
===================================================== */

let DATA = {

    buttons: [],

    logos: [],

    shortsAi: [],

    aiBall: [],

    crazyBall: [],

    germanyCover: []

};


/* =====================================================
   BUTTON LOADING STATE
===================================================== */

function setButtonLoading(button, isLoading) {

    if (!button) return;


    if (isLoading) {

        if (!button.dataset.originalHtml) {

            button.dataset.originalHtml = button.innerHTML;

        }

        button.disabled = true;

        button.innerHTML = '<div class="btn-spinner"></div>';

    } else {

        if (button.dataset.originalHtml !== undefined) {

            button.innerHTML = button.dataset.originalHtml;

            delete button.dataset.originalHtml;

        }

        button.disabled = false;

    }

}


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        loadData();

        /*
          อัพเดท Google Sheet
          ทุก 1 นาที
        */

        setInterval(
            loadData,
            60000
        );

    }
);


/* =====================================================
   JSONP
===================================================== */

function jsonp(url) {

    return new Promise(
        function(resolve, reject) {

            const callbackName =
                "callback_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() *
                    99999
                );


            const script =
                document.createElement(
                    "script"
                );


            const timeout =
                setTimeout(
                    function() {

                        cleanup();

                        reject(
                            new Error(
                                "หมดเวลาการเชื่อมต่อ"
                            )
                        );

                    },
                    15000
                );


            function cleanup() {

                clearTimeout(
                    timeout
                );


                delete window[
                    callbackName
                ];


                if (
                    script.parentNode
                ) {

                    script.parentNode
                        .removeChild(
                            script
                        );

                }

            }


            window[
                callbackName
            ] =
                function(data) {

                    cleanup();

                    resolve(data);

                };


            script.onerror =
                function() {

                    cleanup();

                    reject(
                        new Error(
                            "ไม่สามารถเชื่อมต่อ Google Apps Script"
                        )
                    );

                };


            script.src =
                url +
                "&callback=" +
                callbackName;


            document.body.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    try {

        const result =
            await jsonp(
                API_URL +
                "?action=getData"
            );


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "โหลดข้อมูลไม่สำเร็จ"
            );

        }


        /*
          เก็บข้อมูลใหม่

          สำคัญ:
          logos / shortsAi / AI / บอลบ้า / germanyCover
          จะไม่ถูกนำไปใส่ Input
        */

        DATA =
            result;


        /*
          อัพเดทเฉพาะปุ่มเมนูด่วน
        */

        renderQuickButtons();


        /*
          สร้างช่อง Input ใหม่
          โดยตั้งใจให้เป็นช่องว่าง
        */

        renderLogos();

        renderShortsAi();

        renderAI();

        renderCrazy();

        renderGermanyCover();


        /*
          เวลาอัพเดทจริง
        */

        updateTime();


        /*
          ซ่อน Loading
        */

        document
            .getElementById(
                "loading"
            )
            .classList
            .add(
                "hide"
            );


    } catch(error) {

        console.error(
            error
        );


        document
            .getElementById(
                "updateTime"
            )
            .textContent =
                "อัพเดทข้อมูลแล้วเมื่อ " +
                "เชื่อมต่อไม่สำเร็จ";


        /*
          ถ้าเป็นการอัพเดทครั้งแรก
        */

        document
            .getElementById(
                "loading"
            )
            .classList
            .add(
                "hide"
            );

    }

}


/* =====================================================
   UPDATE TIME
===================================================== */

function updateTime() {

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "th-TH",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false
            }
        );


    document
        .getElementById(
            "updateTime"
        )
        .textContent =
            "อัพเดทข้อมูลแล้วเมื่อ " +
            time;

}


/* =====================================================
   QUICK BUTTONS
   A2:B17
   16 BUTTONS
===================================================== */

function renderQuickButtons() {

    const container =
        document.getElementById(
            "quickButtons"
        );


    container.innerHTML =
        "";


    DATA.buttons.forEach(
        function(
            item,
            index
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "quick-button";


            button.textContent =
                item.name ||
                "ปุ่ม " +
                (
                    index +
                    1
                );


            button.onclick =
                async function() {

                    setButtonLoading(button, true);

                    const startTime = Date.now();

                    await copyText(
                        item.text
                    );

                    /*
                      หน่วงเวลาให้ตัวหมุนแสดงอย่างน้อย 600ms
                      เพื่อให้ผู้ใช้รู้สึกว่าระบบทำงานเรียบร้อย
                    */

                    const elapsed = Date.now() - startTime;

                    if (elapsed < 600) {

                        await new Promise(resolve => setTimeout(resolve, 600 - elapsed));

                    }

                    setButtonLoading(button, false);

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   LOGOS
   B18:B23
===================================================== */

function renderLogos() {

    const container =
        document.getElementById(
            "logoContainer"
        );


    container.innerHTML =
        "";


    for (
        let i = 0;
        i < 6;
        i++

          ไม่ดึง B18:B23

        */

}

}


/* =====================================================
   GERMANY COVER PROMPT
   B31
===================================================== */

function renderGermanyCover() {

    const container =
        document.getElementById(
            "germanyContainer"
        );


    container.innerHTML =
        "";


    const row =
        createInputRow({

            label:

/* =====================================================
   CREATE INPUT ROW
===================================================== */

function createInputRow(
    options
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "input-row";


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "input-label";


    label.textContent =
        options.label;


    /*
      เปลี่ยนเป็น textarea เพื่อรองรับการขึ้นบรรทัดใหม่
    */

    const input =
        document.createElement(
            "textarea"
        );


    input.className =
        "input-box";


    input.rows =
        2;


    input.value =
        "";


    /*
      ไม่ใส่คำอธิบายในช่อง
      ไม่มี placeholder
    */


    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "actions";


    /* =================================================
       SEND
    ================================================= */

    const send =
        document.createElement(
            "button"
        );


    send.className =
        "btn btn-send";


    send.textContent =
        "ส่ง";


    send.onclick =
        async function() {

            setButtonLoading(send, true);

            await sendToSheet(
                options.row,
                input
            );

            setButtonLoading(send, false);

        };


    /* =================================================
       COPY
    ================================================= */

    const copy =
        document.createElement(
            "button"
        );


    copy.className =
        "btn btn-copy";


    copy.textContent =
        "คัดลอก";


    copy.onclick =
        async function() {

            setButtonLoading(copy, true);

            /*
              Copy จากข้อมูลล่าสุด
              ใน Google Sheet
            */

            await copySheetValue(
                options.row
            );

            setButtonLoading(copy, false);

        };


    actions.appendChild(
        send
    );


    actions.appendChild(
        copy
    );


    /* =================================================
       DOWNLOAD
       เฉพาะ LOGO
    ================================================= */

    if (
        options.download
    ) {

        const download =
            document.createElement(
                "button"
            );


        download.className =
            "btn btn-download";


        download.textContent =
            "Download";


        download.onclick =
            async function() {

                setButtonLoading(download, true);

                /*
                  Download จาก Google Sheet
                */

                await downloadLogo(
                    options.row
                );

                setButtonLoading(download, false);

            };


        actions.appendChild(
            download
        );

    }


    row.appendChild(
        label
    );


    row.appendChild(
        input
    );


    row.appendChild(
        actions
    );


    return row;

}


/* =====================================================
   SEND TO GOOGLE SHEET
===================================================== */

async function sendToSheet(
    row,
    input
) {

    const value =
        input.value;


    /*
      ไม่ส่งช่องว่าง
    */

    if (
        !value.trim()
    ) {

        showToast(
            "กรุณาใส่ข้อมูลก่อนส่ง"
        );

        return;

    }


    const form =
        document.createElement(
            "form"
        );


    form.method =
        "POST";


    form.action =
        API_URL;


    form.target =
        "postFrame";


    const rowInput =
        document.createElement(
            "input"
        );


    rowInput.type =
        "hidden";


    rowInput.name =
        "row";


    rowInput.value =
        row;


    const valueInput =
        document.createElement(
            "textarea"
        );


    valueInput.style.display =
        "none";


    valueInput.name =
        "value";


    valueInput.value =
        value;


    form.appendChild(
        rowInput
    );


    form.appendChild(
        valueInput
    );


    document.body.appendChild(
        form
    );


    form.submit();


    form.remove();


    /*
      เมื่อส่งสำเร็จ
      ล้างเฉพาะช่องที่กด
    */

    input.value =
        "";


    showToast(
        "ส่งข้อมูลเรียบร้อยแล้ว ✓"
    );


    /*
      อัพเดทข้อมูลจาก Sheet
      หลังจากส่งเล็กน้อย
    */

    await new Promise(resolve => setTimeout(resolve, 1000));

    await loadData();

}


/* =====================================================
   COPY FROM GOOGLE SHEET
===================================================== */

async function copySheetValue(
    row
) {

    /*
      โหลดข้อมูลล่าสุดก่อน
      เพื่อให้ Copy เป็นค่าปัจจุบัน
    */

    try {

        const result =
            await jsonp(
                API_URL +
                "?action=getData"
            );


        if (
            !result.success
        ) {

            throw new Error(
                "โหลดข้อมูลไม่สำเร็จ"
            );

        }


        let value = "";


        /*
          B18:B23
        */

        if (
            row >= 18 &&
            row <= 23
        ) {

            value =
                result
                    .logos[
                        row -
                        18
                    ] || "";

        }


        /*
          B24
        */

        else if (
            row === 24
        ) {

            value =
                result
                    .shortsAi[0] || "";

        }


        /*
          B25:B27
        */

        else if (
            row >= 25 &&
            row <= 27
        ) {

            value =
                result
                    .aiBall[
                        row -
                        25
                    ] || "";

        }


        /*
          B28:B30
        */

        else if (
            row >= 28 &&
            row <= 30
        ) {

            value =
                result
                    .crazyBall[
                        row -
                        28
                    ] || "";

        }


        /*
          B31
        */

        else if (
            row === 31
        ) {

            value =
                result
                    .germanyCover[0] || "";

        }


        if (!value) {

            showToast(
                "ไม่มีข้อมูลใน Google Sheet"
            );

            return;

        }


        await copyText(value);


    } catch(error) {

        console.error(
            error
        );


        showToast(
            "คัดลอกไม่สำเร็จ"
        );

    }

}


/* =====================================================
   DOWNLOAD LOGO
===================================================== */

async function downloadLogo(
    row
) {

    /*
      Download เฉพาะ B18:B23
    */

    if (
        row < 18 ||
        row > 23
    ) {

        return;

    }


    /*
      ดึงข้อมูลล่าสุดจาก Sheet
    */

    let url = "";


    try {

        const result =
            await jsonp(
                API_URL +
                "?action=getData"
            );


        if (
            !result.success
        ) {

            throw new Error(
                "โหลดข้อมูลไม่สำเร็จ"
            );

        }


        url =
            result
                .logos[
                    row -
                    18
                ] || "";


    } catch(error) {

        showToast(
            "ไม่สามารถอ่าน URL จาก Google Sheet"
        );

        return;

    }


    if (!url) {

        showToast(
            "ไม่มี URL รูปภาพใน Google Sheet"
        );

        return;

    }


    showToast(
        "กำลังเตรียม PNG 3000×3000..."
    );


    try {

        /*
          ขอรูปผ่าน Apps Script
        */

        const result =
            await jsonp(

                API_URL +
                "?action=image&url=" +
                encodeURIComponent(
                    url
                )

            );


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "โหลดรูปไม่สำเร็จ"
            );

        }


        await new Promise((resolve, reject) => {

            const image =
                new Image();


            image.onload =
                function() {

                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        3000;


                    canvas.height =
                        3000;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    /*
                      พื้นหลังโปร่งใส
                    */

                    ctx.clearRect(
                        0,
                        0,
                        3000,
                        3000
                    );


                    /*
                      รักษาสัดส่วนภาพ
                    */

                    const scale =
                        Math.min(
                            3000 /
                            image.width,

                            3000 /
                            image.height
                        );


                    const width =
                        image.width *
                        scale;


                    const height =
                        image.height *
                        scale;


                    const x =
                        (
                            3000 -
                            width
                        ) / 2;


                    const y =
                        (
                            3000 -
                            height
                        ) / 2;


                    ctx.drawImage(

                        image,

                        x,
                        y,

                        width,
                        height

                    );


                    canvas.toBlob(

                        function(blob) {

                            const downloadUrl =
                                URL.createObjectURL(
                                    blob
                                );


                            const a =
                                document.createElement(
                                    "a"
                                );


                            /*
                              B18 = 1.png
                              B19 = 2.png
                              B20 = 3.png
                              B21 = 4.png
                              B22 = 5.png
                              B23 = 6.png
                            */

                            const fileNumber =
                                row -
                                17;


                            a.href =
                                downloadUrl;


                            a.download =
                                fileNumber +
                                ".png";


                            document.body.appendChild(
                                a
                            );


                            a.click();


                            a.remove();


                            URL.revokeObjectURL(
                                downloadUrl
                            );


                            showToast(

                                "ดาวน์โหลด " +
                                fileNumber +
                                ".png แล้ว ✓"

                            );

                            resolve();

                        },

                        "image/png"

                    );

                };


            image.onerror =
                function() {

                    showToast(
                        "ไม่สามารถอ่านรูปภาพได้"
                    );

                    reject(new Error("Image load error"));

                };


            image.src =
                "data:" +
                result.mime +
                ";base64," +
                result.base64;

        });


    } catch(error) {

        console.error(
            error
        );


        showToast(
            "ดาวน์โหลดไม่สำเร็จ"
        );

    }

}


/* =====================================================
   COPY TEXT
===================================================== */

async function copyText(
    text
) {

    if (!text) {

        showToast(
            "ไม่มีข้อมูลให้คัดลอก"
        );

        return;

    }


    try {

        await navigator
            .clipboard
            .writeText(
                text
            );


        showToast(
            "คัดลอกข้อมูลแล้ว ✓"
        );


    } catch(error) {

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position = "fixed";

        textarea.style.opacity = "0";

        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        showToast(
            "คัดลอกข้อมูลแล้ว ✓"
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(

            function() {

                toast.classList.remove(
                    "show"
                );

            },

            2500

        );

}
