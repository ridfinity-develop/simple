<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiD Finity Dashboard</title>

<style>
/* =====================================================
   RESET
===================================================== */
* {
    box-sizing: border-box;
}

/* =====================================================
   BODY
===================================================== */
body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Noto Sans Thai", Arial, sans-serif;
    background: radial-gradient(circle at top right, #25304a 0%, #111827 35%, #080b12 100%);
    color: white;
}

/* =====================================================
   CONTAINER
===================================================== */
.container {
    width: min(1200px, 94%);
    margin: auto;
    padding: 25px 0 50px;
}

/* =====================================================
   HEADER
===================================================== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.title-area {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.logo-title {
    font-size: 26px;
    font-weight: 800;
}

.settings-area {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
}

.update-time {
    font-size: 13px;
    color: #9ca3af;
}

.settings-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 44px;
    padding: 0 17px;
    border: none;
    border-radius: 11px;
    background: #374151;
    color: white;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    transition: .2s;
}

.settings-button:hover {
    background: #4b5563;
    transform: translateY(-1px);
}

/* =====================================================
   CARD
===================================================== */
.card {
    background: rgba(17, 24, 39, .88);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    backdrop-filter: blur(15px);
}

.card-header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.card-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}

.toggle-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background 0.2s;
}

.toggle-btn:hover {
    background: rgba(255, 255, 255, 0.1);
}

/* =====================================================
   TAB NAVIGATION
===================================================== */
.tab-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 15px;
}

.tab-btn {
    background: #1f2937;
    color: #9ca3af;
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

.tab-btn:hover {
    background: #374151;
    color: white;
}

.tab-btn.active {
    background: #6366f1;
    color: white;
    border-color: #6366f1;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* =====================================================
   QUICK BUTTONS
===================================================== */
.quick-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.grid-5 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.quick-button {
    border: none;
    min-height: 65px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 8px 20px rgba(37, 99, 235, .25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.quick-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}

.quick-button:active {
    transform: scale(.97);
}

/* =====================================================
   TEAM QUICK BUTTONS
===================================================== */
.team-quick-buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

/* Inline / Top Quick Buttons */
.inline-quick-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

.inline-quick-buttons .quick-button {
    min-height: 45px;
    padding: 0 20px;
    flex: 1;
    min-width: 120px;
}

/* =====================================================
   INPUT ROW
===================================================== */
.input-row {
    display: grid;
    grid-template-columns: 200px 1fr auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
}

.input-label {
    font-weight: 700;
    color: #e5e7eb;
}

.input-box {
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    border-radius: 11px;
    border: 1px solid #374151;
    background: #0b1120;
    color: white;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
}

.input-box:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .15);
}

/* =====================================================
   ACTIONS
===================================================== */
.actions {
    display: flex;
    gap: 7px;
}

.btn {
    border: none;
    border-radius: 10px;
    min-width: 78px;
    min-height: 43px;
    padding: 0 13px;
    color: white;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.btn:hover {
    filter: brightness(1.15);
}

.btn-send {
    background: #16a34a;
}

.btn-copy {
    background: #2563eb;
}

.btn-download {
    background: #9333ea;
}

/* =====================================================
   BUTTON SPINNER
===================================================== */
.btn-spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: #ffffff;
    animation: spin 1s linear infinite;
}

/* =====================================================
   TOAST
===================================================== */
.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translate(-50%, 120px);
    background: #111827;
    border: 1px solid rgba(255, 255, 255, .12);
    color: white;
    padding: 13px 22px;
    border-radius: 50px;
    font-weight: 700;
    opacity: 0;
    transition: .3s;
    z-index: 9999;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* =====================================================
   LOADING
===================================================== */
.loading {
    position: fixed;
    inset: 0;
    background: #080b12;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10000;
    transition: .3s;
}

.loading.hide {
    opacity: 0;
    pointer-events: none;
}

.spinner {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 4px solid #374151;
    border-top-color: #6366f1;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   MOBILE
===================================================== */
@media(max-width: 800px) {
    .container {
        width: 94%;
        padding-top: 15px;
    }

    .header {
        align-items: flex-start;
        flex-direction: row;
        gap: 10px;
    }

    .logo-title {
        font-size: 21px;
    }

    .settings-area {
        align-items: flex-end;
    }

    .update-time {
        font-size: 11px;
    }

    .settings-button {
        min-width: 45px;
        width: 45px;
        padding: 0;
        font-size: 0;
    }

    .settings-button .gear {
        font-size: 21px;
    }

    .quick-buttons {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid-5 {
        grid-template-columns: repeat(2, 1fr);
    }

    .team-quick-buttons {
        grid-template-columns: repeat(3, 1fr);
    }

    .input-row {
        grid-template-columns: 1fr;
        gap: 7px;
    }

    .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
    }

    .btn {
        width: 100%;
    }
}

/* =====================================================
   SMALL PHONE
===================================================== */
@media(max-width: 420px) {
    .card {
        padding: 15px;
        border-radius: 16px;
    }

    .quick-button {
        min-height: 60px;
        font-size: 13px;
    }

    .team-quick-buttons {
        grid-template-columns: repeat(2, 1fr);
    }

    .input-label {
        font-size: 14px;
    }

    .btn {
        font-size: 12px;
        min-width: 0;
    }
}
</style>
</head>

<script>
/* =====================================================
   CONFIG
===================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbx-rKYscSSSPgw1dTlzf5BriEn9MPrQfFIEWDza6fYd2nxlPTnCsBT2sWNOLr6csF4k/exec";

/* =====================================================
   DATA & STATE
===================================================== */
let DATA = {
    voiceButtons: [],
    btnA6_B6: null,
    btnA7_B7: null,
    btnA8_B8: null,
    btnA17_B17: null,
    btnA40_B40: null,
    btnA39_B39: null,
    btnF22_G22: null,
    germanyButtons: [],
    germanyBottomButtons: [],
    soundCreateButtons1: [],
    soundCreateButtons2: [],
    soundPromptButtons: [],
    ytDescButtons: [],
    btnF10_G10: null,
    teamQuickButtons1: [],
    teamQuickButtons2: [],
    bloggerAnalysisTop: [],
    bloggerAnalysisBottom: [],
    bloggerNewsTop: [],
    bloggerNewsBottom: []
};

let sentStatus = {};

/* =====================================================
   TOGGLE SECTION HELPER
===================================================== */
function toggleSection(elementId, btnId) {
    const target = document.getElementById(elementId);
    const btn = document.getElementById(btnId);
    if (!target || !btn) return;

    const isLogo = elementId.startsWith('logoBody');
    const isSoundInput = elementId.startsWith('soundInputBody');
    const isBallAnalysis = elementId === 'ballAnalysisBody';
    const isBallNews = elementId === 'ballNewsBody';

    let currentIcon = "🙈";

    if (target.style.display === "none") {
        target.style.display = "block";
        currentIcon = "👁️";
    } else {
        target.style.display = "none";
        currentIcon = "🙈";
    }

    let isSent = false;
    if (isLogo) {
        const logoIdx = elementId.replace('logoBody', '');
        isSent = sentStatus['logo' + logoIdx];
    } else if (isSoundInput) {
        const soundIdx = elementId.replace('soundInputBody', '');
        isSent = sentStatus['sound' + soundIdx];
    } else if (isBallAnalysis) {
        isSent = sentStatus['ballAnalysis'];
    } else if (isBallNews) {
        isSent = sentStatus['ballNews'];
    }

    btn.textContent = currentIcon + (isSent ? ' 💯' : '');
}

/* =====================================================
   TAB SWITCHING
===================================================== */
function switchTab(tabId) {
    const contents = document.querySelectorAll('.tab-content');
    contents.forEach(function(content) {
        content.classList.remove('active');
    });

    const buttons = document.querySelectorAll('.tab-btn');
    buttons.forEach(function(btn) {
        btn.classList.remove('active');
    });

    const targetContent = document.getElementById('tab-' + tabId);
    if (targetContent) {
        targetContent.classList.add('active');
    }

    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }
}

/* =====================================================
   BUTTON LOADING STATE
===================================================== */
function setButtonLoading(button, isLoading) {
    if (!button) return;
    if (isLoading) {
        if (!button.dataset.originalHtml) {
            button.dataset.originalHtml = button.innerHTML;
        }
        button.disabled = true;
        button.innerHTML = '<div class="btn-spinner"></div>';
    } else {
        if (button.dataset.originalHtml !== undefined) {
            button.innerHTML = button.dataset.originalHtml;
            delete button.dataset.originalHtml;
        }
        button.disabled = false;
    }
}

/* =====================================================
   INIT
===================================================== */
window.addEventListener("DOMContentLoaded", function() {
    loadData();
});

/* =====================================================
   JSONP
===================================================== */
function jsonp(url) {
    return new Promise(function(resolve, reject) {
        const callbackName = "callback_" + Date.now() + "_" + Math.floor(Math.random() * 99999);
        const script = document.createElement("script");
        const timeout = setTimeout(function() {
            cleanup();
            reject(new Error("หมดเวลาการเชื่อมต่อ"));
        }, 15000);

        function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }
        }

        window[callbackName] = function(data) {
            cleanup();
            resolve(data);
        };

        script.onerror = function() {
            cleanup();
            reject(new Error("ไม่สามารถเชื่อมต่อ Google Apps Script"));
        };

        script.src = url + "&callback=" + callbackName;
        document.body.appendChild(script);
    });
}

/* =====================================================
   LOAD DATA
===================================================== */
async function loadData() {
    try {
        const result = await jsonp(API_URL + "?action=getData");
        if (!result.success) {
            throw new Error(result.error || "โหลดข้อมูลไม่สำเร็จ");
        }

        DATA = result;

        renderTeamQuickButtons();
        renderVoiceButtons();
        renderYtDescButtons();
        renderTeamNames();
        renderLogos();
        renderShortsAi();
        renderAI();
        renderGermanyCover();
        renderSoundTest();
        renderBloggerAi();

        updateTime();

        document.getElementById("loading").classList.add("hide");
    } catch(error) {
        console.error(error);
        document.getElementById("updateTime").textContent = "อัพเดทข้อมูลแล้วเมื่อ เชื่อมต่อไม่สำเร็จ";
        document.getElementById("loading").classList.add("hide");
    }
}

/* =====================================================
   UPDATE TIME
===================================================== */
function updateTime() {

/* =====================================================
   FETCH AND COPY REAL-TIME
===================================================== */
async function fetchAndCopy(button, item) {
    setButtonLoading(button, true);
    try {
        let url = API_URL + "?action=getButtonText";
        if (item.cell) {
            url += "&cell=" + encodeURIComponent(item.cell);
        } else if (item.type) {
            url += "&type=" + encodeURIComponent(item.type) + "&index=" + item.index;
        }

        const res = await jsonp(url);
        if (res.success) {
            if (res.text !== undefined && res.text !== null && String(res.text).trim() !== "") {
                await copyText(String(res.text));
            } else {
                showToast("ไม่มีข้อมูลใน Google Sheet");
            }
        } else {
            showToast("ดึงข้อมูลไม่สำเร็จ");
        }
    } catch (e) {
        console.error(e);
        showToast("เกิดข้อผิดพลาดในการดึงข้อมูล");
    } finally {
        setButtonLoading(button, false);
    }
}

/* =====================================================
   CREATE INPUT ROW
===================================================== */
function createInputRow(options) {
    const rowKey = options.cell || options.row;
    const row = document.createElement("div");
    row.className = "input-row";

    const label = document.createElement("div");
    label.className = "input-label";

    const isSent = sentStatus[rowKey];
    
    if (options.isLogoRow || options.isSoundRow || options.isBallAnalysis || options.isBallNews) {
        label.textContent = options.label;
    } else {
        label.textContent = (isSent ? "💯 " : "") + options.label;
    }

    const input = document.createElement("textarea");
    input.className = "input-box";
    input.rows = 2;
    input.value = "";

    const actions = document.createElement("div");
    actions.className = "actions";

    /* SEND */
    const send = document.createElement("button");
    send.className = "btn btn-send";
    send.textContent = "ส่ง";
    send.onclick = async function() {
        setButtonLoading(send, true);
        const success = await sendToSheet(options, input);
        if (success) {
            sentStatus[rowKey] = true;
            if (options.isLogoRow) {
                sentStatus['logo' + options.logoIndex] = true;
                const toggleBtn = document.getElementById("btnToggleLogo" + options.logoIndex);
                if (toggleBtn) {
                    const currentIcon = toggleBtn.textContent.includes("👁️") ? "👁️" : "🙈";
                    toggleBtn.textContent = currentIcon + " 💯";
                }
            } else if (options.isSoundRow) {
                sentStatus['sound' + options.soundIndex] = true;
                const toggleBtn = document.getElementById("btnToggleSoundInput" + options.soundIndex);
                if (toggleBtn) {
                    const currentIcon = toggleBtn.textContent.includes("👁️") ? "👁️" : "🙈";
                    toggleBtn.textContent = currentIcon + " 💯";
                }
            } else if (options.isBallAnalysis) {
                sentStatus['ballAnalysis'] = true;
                const toggleBtn = document.getElementById("btnToggleBallAnalysis");
                if (toggleBtn) {
                    const currentIcon = toggleBtn.textContent.includes("👁️") ? "👁️" : "🙈";
                    toggleBtn.textContent = currentIcon + " 💯";
                }
            } else if (options.isBallNews) {
                sentStatus['ballNews'] = true;
                const toggleBtn = document.getElementById("btnToggleBallNews");
                if (toggleBtn) {
                    const currentIcon = toggleBtn.textContent.includes("👁️") ? "👁️" : "🙈";
                    toggleBtn.textContent = currentIcon + " 💯";
                }
            } else {
                label.textContent = "💯 " + options.label;
            }
        }
        setButtonLoading(send, false);
    };
    actions.appendChild(send);

    /* COPY */
    if (options.hasCopy !== false) {
        const copy = document.createElement("button");
        copy.className = "btn btn-copy";
        copy.textContent = "คัดลอก";
        copy.onclick = async function() {
            setButtonLoading(copy, true);
            await copySheetValue(options);
            setButtonLoading(copy, false);
        };
        actions.appendChild(copy);
    }

    /* DOWNLOAD */
    if (options.download) {
        const download = document.createElement("button");
        download.className = "btn btn-download";
        download.textContent = "Download";
        download.onclick = async function() {
            setButtonLoading(download, true);
            await downloadLogo(options.row);
            setButtonLoading(download, false);
        };
        actions.appendChild(download);
    }

    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(actions);

    return row;
}

/* =====================================================
   SEND TO GOOGLE SHEET
===================================================== */
async function sendToSheet(options, input) {
    const value = input.value;
    if (!value.trim()) {
        showToast("กรุณาใส่ข้อมูลก่อนส่ง");
        return false;
    }

    const form = document.createElement("form");
    form.method = "POST";
    form.action = API_URL;
    form.target = "postFrame";

    if (options.cell) {
        const cellInput = document.createElement("input");
        cellInput.type = "hidden";
        cellInput.name = "cell";
        cellInput.value = options.cell;
        form.appendChild(cellInput);
    } else {
        const rowInput = document.createElement("input");
        rowInput.type = "hidden";
        rowInput.name = "row";
        rowInput.value = options.row;
        form.appendChild(rowInput);
    }

    const valueInput = document.createElement("textarea");
    valueInput.style.display = "none";
    valueInput.name = "value";
    valueInput.value = value;
    form.appendChild(valueInput);

    document.body.appendChild(form);
    form.submit();
    form.remove();

    input.value = "";
    showToast("ส่งข้อมูลเรียบร้อยแล้ว ✓");

    await new Promise(resolve => setTimeout(resolve, 800));
    await loadData();
    return true;
}

/* =====================================================
   COPY FROM GOOGLE SHEET
===================================================== */
async function copySheetValue(options) {
    try {
        let url = API_URL + "?action=getButtonText";
        if (options.copyCell) {
            url += "&cell=" + encodeURIComponent(options.copyCell);
        } else if (options.cell) {
            url += "&cell=" + encodeURIComponent(options.cell);
        } else {
            const row = options.row;
            if (row === 18) {
                url += "&cell=B18";
            } else if (row >= 25 && row <= 30) {
                url += "&cell=B" + row;
            } else if (row === 31) {
                url += "&cell=B31";
            } else if (row >= 32 && row <= 34) {
                url += "&cell=B" + row;
            } else if (row >= 35 && row <= 37) {
                url += "&cell=B" + row;
            } else if (row === 38) {
                url += "&cell=B38";
            } else if (row === 39) {
                url += "&cell=B39";
            }
        }

        const result = await jsonp(url);
        if (!result.success) {
            showToast("ไม่สามารถเชื่อมต่อได้");
            return;
        }

        if (result.text === undefined || result.text === null || String(result.text).trim() === "") {
            showToast("ไม่มีข้อมูลใน Google Sheet");
            return;
        }

        await copyText(String(result.text));
    } catch(error) {
        console.error(error);
        showToast("คัดลอกไม่สำเร็จ");
    }
}

/* =====================================================
   DOWNLOAD LOGO
===================================================== */
async function downloadLogo(row) {
    if (row < 25 || row > 30) return;

    let url = "";
    try {
        const result = await jsonp(API_URL + "?action=getButtonText&cell=B" + row);
        if (!result.success) throw new Error("โหลดข้อมูลไม่สำเร็จ");
        url = result.text || "";
    } catch(error) {
        showToast("ไม่สามารถอ่าน URL จาก Google Sheet");
        return;
    }

    if (!url) {
        showToast("ไม่มี URL รูปภาพใน Google Sheet");
        return;
    }

    showToast("กำลังเตรียม PNG 3000×3000...");

    try {
        const result = await jsonp(API_URL + "?action=image&url=" + encodeURIComponent(url));
        if (!result.success) throw new Error(result.error || "โหลดรูปไม่สำเร็จ");

        await new Promise((resolve, reject) => {
            const image = new Image();
            image.onload = function() {
                const canvas = document.createElement("canvas");
                canvas.width = 3000;
                canvas.height = 3000;
                const ctx = canvas.getContext("2d");
                ctx.clearRect(0, 0, 3000, 3000);

                const scale = Math.min(3000 / image.width, 3000 / image.height);
                const width = image.width * scale;
                const height = image.height * scale;
                const x = (3000 - width) / 2;
                const y = (3000 - height) / 2;

                ctx.drawImage(image, x, y, width, height);

                canvas.toBlob(function(blob) {
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    const fileNumber = row - 24;
                    a.href = downloadUrl;
                    a.download = fileNumber + ".png";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(downloadUrl);
                    showToast("ดาวน์โหลด " + fileNumber + ".png แล้ว ✓");
                    resolve();
                }, "image/png");
            };

            image.onerror = function() {
                showToast("ไม่สามารถอ่านรูปภาพได้");
                reject(new Error("Image load error"));
            };

            image.src = "data:" + result.mime + ";base64," + result.base64;
        });
    } catch(error) {
        console.error(error);
        showToast("ดาวน์โหลดไม่สำเร็จ");
    }
}

/* =====================================================
   COPY TEXT
===================================================== */
async function copyText(text) {
    if (!text) {
        showToast("ไม่มีข้อมูลให้คัดลอก");
        return;
    }

    let isSuccess = false;
    if (navigator.clipboard && window.isSecureContext) {
        try {
            await navigator.clipboard.writeText(text);
            isSuccess = true;
        } catch (err) {
            isSuccess = false;
        }
    }

    if (!isSuccess) {
        try {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";
            textarea.style.top = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            isSuccess = document.execCommand("copy");
            textarea.remove();
        } catch (e) {
            isSuccess = false;
        }
    }

    if (isSuccess) {
        showToast("คัดลอกข้อมูลแล้ว ✓");
    } else {
        showToast("คัดลอกไม่สำเร็จ");
    }
}

/* =====================================================
   TOAST
===================================================== */
let toastTimer;
function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
        toast.classList.remove("show");
    }, 2500);
}
